<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Set owner password · SharePass</title>
<link rel="stylesheet" href="/counter.css">
<link rel="stylesheet" href="/admin.css">
</head>
<body>
  <div class="shell admin-shell">
    <header><a class="menu-link" href="/account">← Account</a><strong>SharePass</strong></header>
    <main>
      <h1>Set owner password</h1>
      <form class="admin-card" id="owner-credentials" data-action="password">
        <p>Choose a fresh password for your SharePass owner ID.</p>
        <label class="field">New password <input name="password" type="password" autocomplete="new-password" minlength="15" maxlength="128" aria-describedby="owner-password-help" required></label>
        <small id="owner-password-help">Use at least 15 characters and keep it private. Saving signs out other SharePass password sessions.</small>
        <button type="submit" class="primary">Save password</button>
        <p id="owner-credentials-status" role="status"></p>
      </form>
    </main>
  </div>
  <script defer src="/owner-signin.js"></script>
</body>
</html>
