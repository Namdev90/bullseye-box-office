name: Publish verified SharePass Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft tag in android-vX.Y.Z form
        required: true
        type: string
      version_code:
        description: Approved Android version code
        required: true
        type: string
      apk_sha256:
        description: SHA-256 of the exact approved signed APK
        required: true
        type: string
      promote_latest:
        description: Make this Android release the update feed's latest version
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: sharepass-android-release
  cancel-in-progress: false

jobs:
  verify-and-publish:
    if: github.repository == 'Namdev90/bullseye-box-office' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android build tools
        run: |
          sdk_root="${ANDROID_HOME:?Android SDK unavailable on the runner}"
          if [[ ! -x "$sdk_root/build-tools/36.0.0/aapt" || ! -f "$sdk_root/build-tools/36.0.0/lib/apksigner.jar" ]]; then
            manager="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
            test -x "$manager"
            "$manager" --sdk_root="$sdk_root" --install 'build-tools;36.0.0'
          fi
          test -x "$sdk_root/build-tools/36.0.0/zipalign"
      - name: Verify the approved draft and publish its exact assets
        id: publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          VERSION_CODE: ${{ inputs.version_code }}
          APK_SHA256: ${{ inputs.apk_sha256 }}
          PROMOTE_LATEST: ${{ inputs.promote_latest }}
        run: |
          [[ "$RELEASE_TAG" =~ ^android-v(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]]
          [[ "$APK_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$PROMOTE_LATEST" == true || "$PROMOTE_LATEST" == false ]]
          if [[ "$PROMOTE_LATEST" == true ]]; then
            (( VERSION_CODE >= 18 ))
          fi
          version="${RELEASE_TAG#android-v}"
          apk="SharePass-Android-$version.apk"
          manifest=sharepass-android-update.json
          dir=$(mktemp -d "$RUNNER_TEMP/sharepass-release.XXXXXXXX")
          api="repos/$GITHUB_REPOSITORY/releases"

          gh api --paginate --slurp "$api?per_page=100" |
            jq -e --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name==$tag)] | select(length==1) | .[0]' > "$dir/draft.json"
          jq -e --arg apk "$apk" --arg manifest "$manifest" --arg digest "sha256:$APK_SHA256" '
            .draft and (.prerelease|not)
            and ([.assets[].name]|sort) == ([$apk,$manifest]|sort)
            and any(.assets[]; .name==$apk and .digest==$digest and .size>0 and .size<=26214400)
            and any(.assets[]; .name==$manifest and .size>0 and .size<=8192)
            and all(.assets[]; .state=="uploaded" and (.digest|test("^sha256:[a-f0-9]{64}$")))
          ' "$dir/draft.json" > /dev/null
          release_id=$(jq -r '.id' "$dir/draft.json")
          download_asset() {
            local file=$1 id recorded expected_size actual_size actual_digest
            id=$(jq -r --arg file "$file" '.assets[] | select(.name==$file) | .id' "$dir/draft.json")
            recorded=$(jq -r --arg file "$file" '.assets[] | select(.name==$file) | .digest' "$dir/draft.json")
            expected_size=$(jq -r --arg file "$file" '.assets[] | select(.name==$file) | .size' "$dir/draft.json")
            gh api -H 'Accept: application/octet-stream' "$api/assets/$id" > "$dir/$file"
            actual_size=$(wc -c < "$dir/$file")
            actual_digest=$(sha256sum < "$dir/$file" | cut -d ' ' -f 1)
            [[ "$actual_size" -eq "$expected_size" && "sha256:$actual_digest" == "$recorded" ]]
          }
          download_asset "$apk"
          download_asset "$manifest"
          node android/tools/sharepass-release.mjs verify "$dir/$apk" "$version" "$VERSION_CODE" "$APK_SHA256" "$dir/$manifest"

          if [[ "$PROMOTE_LATEST" == true ]]; then
            if gh api "$api/latest" > "$dir/latest.json" 2> "$dir/latest-error.txt"; then
              if jq -e '.tag_name | startswith("android-v")' "$dir/latest.json" > /dev/null; then
                latest_asset=$(jq -er --arg name "$manifest" '.assets[] | select(.name==$name and .size>0 and .size<=8192) | .id' "$dir/latest.json")
                gh api -H 'Accept: application/octet-stream' "$api/assets/$latest_asset" > "$dir/latest-manifest.json"
                jq -e --argjson code "$VERSION_CODE" '.schema == 1 and (.versionCode | type=="number" and .<$code)' "$dir/latest-manifest.json" > /dev/null
              fi
            elif ! grep -q '(HTTP 404)' "$dir/latest-error.txt"; then
              cat "$dir/latest-error.txt" >&2
              exit 1
            fi
          fi

          snapshot() { jq -cS '[.assets[]|{id,name,size,digest,state}] | sort_by(.id)' "$1"; }
          gh api "$api/$release_id" > "$dir/verify.json"
          jq -e --arg tag "$RELEASE_TAG" '.draft and (.prerelease|not) and .tag_name==$tag' "$dir/verify.json" > /dev/null
          [[ "$(snapshot "$dir/draft.json")" == "$(snapshot "$dir/verify.json")" ]]
          gh api -X PATCH "$api/$release_id" -F draft=false -f "make_latest=$PROMOTE_LATEST" > "$dir/published.json"
          jq -e --arg tag "$RELEASE_TAG" '(.draft|not) and (.prerelease|not) and .tag_name==$tag' "$dir/published.json" > /dev/null
          [[ "$(snapshot "$dir/draft.json")" == "$(snapshot "$dir/published.json")" ]]
          printf 'manifest_path=%s\n' "$dir/$manifest" >> "$GITHUB_OUTPUT"
          jq -r '.html_url' "$dir/published.json"
  announce:
    needs: verify-and-publish
    if: inputs.promote_latest
    permissions:
      contents: read
    uses: ./.github/workflows/sharepass-announce-release.yml
    with:
      tag: ${{ inputs.tag }}
      version_code: ${{ inputs.version_code }}
